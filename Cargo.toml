[package]
name = "shitix"
version = "0.1.0"
edition = "2024"

# 内核编译成静态库，再由 ld 和 boot/head.S 一起链接成 system 二进制
[lib]
name = "shitix"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
x86_64 = { version = "0.15", default-features = false, features = ["instructions", "const_fn"] }

[features]
default = []
extra-drivers = []

[profile.dev]
panic = "abort"
opt-level = "z"
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"
lto = true
# 装载镜像（text/rodata/data）必须止于 0x90000 的机器参数区之前；
# extra-drivers + SMP 调度器已经让 -O3 的产物顶线，降到 -Os 保住
# 512KB 引导窗口。dev profile 用 -Oz 同理。
opt-level = "s"
